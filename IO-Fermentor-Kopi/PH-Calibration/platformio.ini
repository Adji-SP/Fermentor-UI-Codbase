[platformio]
default_envs = ph-esp32s3

[env:ph-esp32s3]
; Match the installed, known-working Arduino platform; no extra libraries needed.
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
; Conservative 8 MB layout also fits the project's 16 MB board. No PSRAM used.
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPH_USE_NATIVE_USB=1

[env:ph-esp32s3-uart]
extends = env:ph-esp32s3
; Use this ONLY for the USB-to-UART connector, not native USB Serial/JTAG.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DPH_USE_NATIVE_USB=0
