; Legacy C++ PlatformIO build retained for rollback. The active Rust firmware
; is built with Cargo.toml; see README.md. Do not confuse PlatformIO upload
; with the new Rust cargo/espflash workflow.
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-n8r2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; USB debug stays separate from the Nextion UART on GPIO16 RX / GPIO15 TX.
; DS18B20 DQ is wired to ESP32 GPIO12 (1-Wire data, not a clock).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDS18B20_DATA_PIN=12
lib_deps =
    adafruit/Adafruit ADS1X15
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    https://github.com/DFRobot/DFRobot_OxygenSensor.git
